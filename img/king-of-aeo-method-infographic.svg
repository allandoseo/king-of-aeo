<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="DejaVu Serif, Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="parch" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#f7ecd2"/><stop offset="0.7" stop-color="#eddcb5"/><stop offset="1" stop-color="#d9c493"/></radialGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.09"/></feComponentTransfer></filter>
<filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3b2a14" flood-opacity="0.25"/></filter>
</defs>
<rect width="1200" height="900" fill="url(#parch)"/>

<g opacity="0.06" fill="#7a5a2a"><ellipse cx="180" cy="120" rx="220" ry="90"/><ellipse cx="1020" cy="160" rx="180" ry="70"/><ellipse cx="300" cy="780" rx="260" ry="80"/><ellipse cx="950" cy="760" rx="200" ry="90"/><ellipse cx="600" cy="470" rx="420" ry="120"/></g><rect x="28" y="28" width="1144" height="844" fill="none" stroke="#3b2a14" stroke-width="3"/>
<rect x="38" y="38" width="1124" height="824" fill="none" stroke="#c9a227" stroke-width="2"/>
<g transform="translate(38,38) rotate(0)"><path d="M0 0 H46 M0 0 V46" stroke="#c9a227" stroke-width="3" fill="none"/><path d="M7 7 H30 M7 7 V30" stroke="#0b3d91" stroke-width="2" fill="none"/><circle cx="7" cy="7" r="4" fill="#0b3d91" stroke="#c9a227" stroke-width="1.5"/></g><g transform="translate(1162,38) rotate(90)"><path d="M0 0 H46 M0 0 V46" stroke="#c9a227" stroke-width="3" fill="none"/><path d="M7 7 H30 M7 7 V30" stroke="#0b3d91" stroke-width="2" fill="none"/><circle cx="7" cy="7" r="4" fill="#0b3d91" stroke="#c9a227" stroke-width="1.5"/></g><g transform="translate(1162,862) rotate(180)"><path d="M0 0 H46 M0 0 V46" stroke="#c9a227" stroke-width="3" fill="none"/><path d="M7 7 H30 M7 7 V30" stroke="#0b3d91" stroke-width="2" fill="none"/><circle cx="7" cy="7" r="4" fill="#0b3d91" stroke="#c9a227" stroke-width="1.5"/></g><g transform="translate(38,862) rotate(270)"><path d="M0 0 H46 M0 0 V46" stroke="#c9a227" stroke-width="3" fill="none"/><path d="M7 7 H30 M7 7 V30" stroke="#0b3d91" stroke-width="2" fill="none"/><circle cx="7" cy="7" r="4" fill="#0b3d91" stroke="#c9a227" stroke-width="1.5"/></g>
<g transform="translate(576,58) scale(1.0)"><path d="M0 34 L48 34 L44 8 L33 20 L24 2 L15 20 L4 8 Z" fill="#c9a227" stroke="#3b2a14" stroke-width="1.5"/><rect x="0" y="35" width="48" height="6" fill="#c9a227" stroke="#3b2a14" stroke-width="1.5"/><circle cx="24" cy="2" r="3" fill="#0b3d91"/><circle cx="4" cy="8" r="2.5" fill="#0b3d91"/><circle cx="44" cy="8" r="2.5" fill="#0b3d91"/></g>
<text x="600" y="132" font-size="18" fill="#6b5330" text-anchor="middle" letter-spacing="3">Allan Oliveira  •  King of AEO  •  Anno MMXXVI</text>
<text x="600" y="176" font-size="36" font-weight="bold" fill="#3b2a14" text-anchor="middle">The Five Laws of Answer Engine Optimization</text>
<path d="M330 198 H870" stroke="#c9a227" stroke-width="2"/><path d="M560 198 l40 -8 l40 8 l-40 8 z" fill="#0b3d91" stroke="#c9a227" stroke-width="1.5"/>
<g transform="translate(78,222)" filter="url(#shadow)">
<rect width="1044" height="104" fill="#f9f0da" stroke="#c9a227" stroke-width="2"/>
<rect x="4" y="4" width="1036" height="96" fill="none" stroke="#c9a227" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
<rect x="0" y="0" width="118" height="104" fill="#0b3d91"/>
<circle cx="59" cy="52.0" r="38" fill="#0b3d91" stroke="#c9a227" stroke-width="3"/>
<text x="59" y="65.0" font-size="38" font-weight="bold" fill="#c9a227" text-anchor="middle">I</text>
<text x="150" y="42" font-size="26" font-weight="bold" fill="#3b2a14">Answer in the first sentence</text>
<text x="150" y="72" font-size="18" fill="#5a4630">The page targets one question, and sentence one is the answer.</text>
<text x="150" y="94" font-size="18" fill="#5a4630">Engines quote pages that commit; they skip pages that build up to it.</text>
</g>
<g transform="translate(78,336)" filter="url(#shadow)">
<rect width="1044" height="104" fill="#f9f0da" stroke="#c9a227" stroke-width="2"/>
<rect x="4" y="4" width="1036" height="96" fill="none" stroke="#c9a227" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
<rect x="0" y="0" width="118" height="104" fill="#0b3d91"/>
<circle cx="59" cy="52.0" r="38" fill="#0b3d91" stroke="#c9a227" stroke-width="3"/>
<text x="59" y="65.0" font-size="38" font-weight="bold" fill="#c9a227" text-anchor="middle">II</text>
<text x="150" y="42" font-size="26" font-weight="bold" fill="#3b2a14">Date the claim</text>
<text x="150" y="72" font-size="18" fill="#5a4630">“As of” plus a date turns an opinion into a record.</text>
<text x="150" y="94" font-size="18" fill="#5a4630">LLMs prefer current, dated statements when two sources disagree.</text>
</g>
<g transform="translate(78,450)" filter="url(#shadow)">
<rect width="1044" height="104" fill="#e6ebf5" stroke="#0b3d91" stroke-width="2"/>
<rect x="4" y="4" width="1036" height="96" fill="none" stroke="#0b3d91" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
<rect x="0" y="0" width="118" height="104" fill="#0b3d91"/>
<circle cx="59" cy="52.0" r="38" fill="#0b3d91" stroke="#c9a227" stroke-width="3"/>
<text x="59" y="65.0" font-size="32" font-weight="bold" fill="#c9a227" text-anchor="middle">III</text>
<text x="150" y="42" font-size="26" font-weight="bold" fill="#3b2a14">Make the entity unambiguous</text>
<text x="150" y="72" font-size="18" fill="#5a4630">Same name, same title, same description on the page, in the schema graph</text>
<text x="150" y="94" font-size="18" fill="#5a4630">and on every profile linked from sameAs. Engines trust entities they can pin down.</text>
<g transform="translate(818,14)"><path d="M0 0 H216 L226 14 L216 28 H0 L10 14 Z" fill="#c9a227" stroke="#3b2a14" stroke-width="1.5"/><text x="113" y="20" font-size="15" font-weight="bold" fill="#3b2a14" text-anchor="middle">Where most pages fail</text></g>
</g>
<g transform="translate(78,564)" filter="url(#shadow)">
<rect width="1044" height="104" fill="#e6ebf5" stroke="#0b3d91" stroke-width="2"/>
<rect x="4" y="4" width="1036" height="96" fill="none" stroke="#0b3d91" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
<rect x="0" y="0" width="118" height="104" fill="#0b3d91"/>
<circle cx="59" cy="52.0" r="38" fill="#0b3d91" stroke="#c9a227" stroke-width="3"/>
<text x="59" y="65.0" font-size="38" font-weight="bold" fill="#c9a227" text-anchor="middle">IV</text>
<text x="150" y="42" font-size="26" font-weight="bold" fill="#3b2a14">Get corroborated off the page</text>
<text x="150" y="72" font-size="18" fill="#5a4630">One site saying something is a claim. Press, LinkedIn, video and three independent</text>
<text x="150" y="94" font-size="18" fill="#5a4630">mentions saying the same thing is a fact an engine will repeat.</text>
<g transform="translate(818,14)"><path d="M0 0 H216 L226 14 L216 28 H0 L10 14 Z" fill="#c9a227" stroke="#3b2a14" stroke-width="1.5"/><text x="113" y="20" font-size="15" font-weight="bold" fill="#3b2a14" text-anchor="middle">Where most pages fail</text></g>
</g>
<g transform="translate(78,678)" filter="url(#shadow)">
<rect width="1044" height="104" fill="#f9f0da" stroke="#c9a227" stroke-width="2"/>
<rect x="4" y="4" width="1036" height="96" fill="none" stroke="#c9a227" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
<rect x="0" y="0" width="118" height="104" fill="#0b3d91"/>
<circle cx="59" cy="52.0" r="38" fill="#0b3d91" stroke="#c9a227" stroke-width="3"/>
<text x="59" y="65.0" font-size="38" font-weight="bold" fill="#c9a227" text-anchor="middle">V</text>
<text x="150" y="42" font-size="26" font-weight="bold" fill="#3b2a14">Publish at news speed and re-check</text>
<text x="150" y="72" font-size="18" fill="#5a4630">Ship the answer the day the question appears, then ask the engines every week</text>
<text x="150" y="94" font-size="18" fill="#5a4630">and log what they return. What they return is the only metric that matters.</text>
</g>
<text x="100" y="842" font-size="14" fill="#6b5330">AEO = Answer Engine Optimization: being the source ChatGPT, Perplexity, Gemini and Google AI Overviews cite.</text>
<text x="1100" y="842" font-size="17" font-weight="bold" fill="#0b3d91" text-anchor="end">kingofaeo.pro</text>
</svg>